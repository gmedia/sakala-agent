[package]
name = "sakala-agent-runtime"
description = "Runtime abstraction for Sakala agent execution."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait.workspace = true
base64 = "0.23"
sha2 = "0.11.1"
globset = "0.4.21"
nix = { version = "0.32.0", features = ["signal", "process"] }
oci-spec = { version = "0.10.0", default-features = false, features = ["distribution"] }
postgres-protocol = "0.6.12"
sakala-agent-core = { version = "0.19.0", path = "../sakala-agent-core" }
sakala-agent-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tokio-postgres = "0.7.18"
tokio-util.workspace = true
tracing.workspace = true
url = "2.5.8"
uuid.workspace = true
yaml-rust2 = { version = "0.13.0", default-features = false }
ipnet = { version = "2.12.2", features = ["serde"] }

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
