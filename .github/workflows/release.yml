name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux-amd64:
    name: Linux x86_64 binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.88.0

      - name: Verify release candidate
        run: make check

      - name: Verify tag matches binary version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "sakala-agent") | .version')"
          test "$tag_version" = "$package_version"

      - name: Build release binary
        run: cargo build --release --locked -p sakala-agent

      - name: Package and checksum
        run: |
          mkdir -p dist
          cp target/release/sakala-agent dist/sakala-agent-linux-x86_64
          chmod 0755 dist/sakala-agent-linux-x86_64
          sha256sum dist/sakala-agent-linux-x86_64 > dist/SHA256SUMS

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            dist/sakala-agent-linux-x86_64
            dist/SHA256SUMS
