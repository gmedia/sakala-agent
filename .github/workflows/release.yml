name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux-amd64:
    name: Linux x86_64 binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.88.0

      - name: Verify release candidate
        run: make check

      - name: Verify tag matches binary version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "sakala-agent") | .version')"
          test "$tag_version" = "$package_version"

      - name: Build release binaries
        run: cargo build --release --locked -p sakala-agent -p sakala-edge

      - name: Package and checksum
        run: |
          mkdir -p dist
          for binary in sakala-agent sakala-edge; do
            cp "target/release/$binary" "dist/$binary-linux-x86_64"
            chmod 0755 "dist/$binary-linux-x86_64"
          done
          # One line per asset, in the same `dist/<asset>` form as before, so
          # installers that grep for their asset name keep working.
          sha256sum dist/sakala-agent-linux-x86_64 dist/sakala-edge-linux-x86_64 > dist/SHA256SUMS

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
          files: |
            dist/sakala-agent-linux-x86_64
            dist/sakala-edge-linux-x86_64
            dist/SHA256SUMS
